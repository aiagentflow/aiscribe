<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="logo.png">
<title>AiScribe · Session Book</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-navy: #080c16;
  --fg: #f0f6fc;
  --fg-2: #8b949e;
  --fg-3: #484f58;
  --line: rgba(255,255,255,0.06);
  --coral: #ff6354;
  --coral-light: #ff8a7a;
  --coral-glow: rgba(255,99,84,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text',sans-serif;background:var(--bg);color:var(--fg-2);min-height:100vh}

/* Sections */
.section-navy{background:var(--bg-navy);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nav{background:rgba(13,17,23,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-brand img{width:32px;height:32px;border-radius:8px}
.nav-brand h1{font-size:17px;font-weight:700;color:var(--fg);letter-spacing:-0.01em}
.nav-brand span{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--coral-glow);color:var(--coral-light);border:1px solid rgba(255,99,84,0.2);font-weight:600}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-links a{color:var(--fg-2);text-decoration:none;font-size:12px;padding:6px 12px;border-radius:6px;transition:all 0.15s}
.nav-links a:hover{background:rgba(255,255,255,0.04);color:var(--fg)}

.container{max-width:1100px;margin:0 auto;padding:1.5rem}

/* Stats */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-icon.sessions{background:var(--coral-glow);color:var(--coral-light)}
.stat-icon.files{background:rgba(88,166,255,0.1);color:#58a6ff}
.stat-icon.changes{background:rgba(63,185,80,0.1);color:#3fb950}
.stat-info .val{font-size:22px;font-weight:700;color:var(--fg);line-height:1}
.stat-info .lbl{font-size:11px;color:var(--fg-3);margin-top:3px;text-transform:uppercase;letter-spacing:0.04em}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem}
.search-box{flex:1;min-width:220px;position:relative}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.search-box input{width:100%;padding:10px 14px 10px 36px;border-radius:10px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg);font-size:14px;outline:none;transition:border-color 0.15s}
.search-box input:focus{border-color:var(--coral)}
.search-box input::placeholder{color:var(--fg-3)}
.sort-select{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg-2);font-size:13px;cursor:pointer;outline:none;transition:border-color 0.15s}
.sort-select:focus{border-color:var(--coral)}
.btn-refresh{background:var(--bg-card);border:1px solid var(--line);color:var(--fg-2);padding:10px 14px;border-radius:10px;cursor:pointer;font-size:13px;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.btn-refresh:hover{background:var(--coral-glow);border-color:rgba(255,99,84,0.2);color:var(--coral-light)}

/* Session Cards */
.sessions{margin-bottom:1.5rem}
.session-card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:10px;cursor:pointer;transition:all 0.15s}
.session-card:hover{border-color:rgba(255,99,84,0.2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.card-name{font-weight:600;font-size:15px;color:var(--fg);word-break:break-word}
.card-badges{display:flex;gap:6px;flex-shrink:0}
.badge{font-size:10px;padding:2px 10px;border-radius:10px;font-weight:600;white-space:nowrap}
.badge-project{background:rgba(88,166,255,0.08);color:#58a6ff;border:1px solid rgba(88,166,255,0.15)}
.badge-tool{background:rgba(63,185,80,0.08);color:#3fb950;border:1px solid rgba(63,185,80,0.15)}
.card-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
.card-meta span{display:flex;align-items:center;gap:4px}
.card-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--fg-3)}
.card-snippet{font-size:13px;color:var(--fg-2);line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Detail View */
.detail-view{display:none}
.detail-view.active{display:block}
.back-row{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--fg-2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.15s}
.back-btn:hover{border-color:rgba(255,99,84,0.2);color:var(--fg);background:var(--bg-card)}
.detail-card{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:28px 32px}
.detail-card h1{font-size:22px;font-weight:700;color:var(--fg);margin-bottom:12px}
.detail-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg-2);margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.detail-meta .sep{color:var(--fg-3)}
.detail-body{font-size:14px;line-height:1.75;color:var(--fg-2)}
.detail-body h2{font-size:16px;color:var(--fg);margin:24px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.detail-body h3{font-size:14px;color:var(--fg);margin:16px 0 6px}
.detail-body strong{color:var(--fg);font-weight:600}
.detail-body code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:13px;color:var(--coral-light)}
.detail-body ul,.detail-body ol{padding-left:1.5rem;margin:8px 0}
.detail-body li{margin:4px 0}
.detail-body pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto;font-size:13px;margin:12px 0}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:2rem;padding:1rem 0}
.page-btn{padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg-2);font-size:13px;cursor:pointer;transition:all 0.15s;font-weight:500}
.page-btn:hover:not(:disabled){border-color:rgba(255,99,84,0.3);color:var(--coral-light);background:var(--coral-glow)}
.page-btn:disabled{opacity:0.3;cursor:default}
.page-btn.active{background:var(--coral-glow);border-color:rgba(255,99,84,0.3);color:var(--coral-light)}
.page-info{font-size:13px;color:var(--fg-3)}

/* Empty */
.empty-state{text-align:center;padding:80px 20px;color:var(--fg-3)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.4}
.empty-state p{font-size:15px;margin-bottom:8px}
.empty-state code{background:var(--bg-card);padding:3px 8px;border-radius:4px;color:var(--coral-light);font-size:13px}
.loading{text-align:center;padding:60px 20px;color:var(--fg-3);font-size:14px}

@media(max-width:600px){
  .nav-inner{padding:0 1rem}
  .nav-links a{font-size:11px;padding:5px 8px}
  .container{padding:1rem}
  .detail-card{padding:20px 16px}
}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <img src="logo.png" alt="AiScribe" onerror="this.style.display='none'">
      <h1>AiScribe</h1>
      <span>v1.2</span>
    </a>
    <div class="nav-links">
      <a href="https://github.com/aiagentflow/aiscribe" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.npmjs.com/package/aiscribe" target="_blank" rel="noopener">npm</a>
      <a href="https://aiagentflow.dev/aiscribe" target="_blank" rel="noopener">Website</a>
    </div>
  </div>
</div>

<div class="container" id="app">
  <div id="list-view">
    <div class="section-navy" style="padding:1.5rem 0;margin:-1.5rem -1.5rem 0;padding-left:1.5rem;padding-right:1.5rem">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="toolbar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search sessions..." oninput="search()">
      </div>
      <select class="sort-select" id="sort" onchange="search()">
        <option value="date">Newest</option>
        <option value="files">Most files</option>
        <option value="changes">Most changes</option>
      </select>
      <button class="btn-refresh" onclick="load()" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Refresh
      </button>
    </div>
    </div>
    <div class="sessions" id="sessions-list"><div class="loading">Loading sessions...</div></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="detail-view" id="detail-view">
    <div class="back-row">
      <button class="back-btn" onclick="showList()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </button>
    </div>
    <div id="detail-content"></div>
  </div>
</div>

<script>
var currentPage=1,totalPages=1,totalSessions=0;

function load(){var e=document.getElementById("search").value,t=document.getElementById("sort").value;fetch("/api/sessions?page="+currentPage+"&search="+encodeURIComponent(e)+"&sort="+t).then(function(e){return e.json()}).then(function(e){totalPages=e.pages,totalSessions=e.total,renderStats(e.total),renderList(e.items),renderPagination()}).catch(function(){document.getElementById("sessions-list").innerHTML='<div class="empty-state"><div class="empty-icon">!</div><p>Could not connect to server.</p><p style="font-size:13px;color:var(--fg-3)">Is aiscribe server running?</p></div>'})}
function renderStats(e){var t=e||0,a=0,i=0;if(t>0){var n=document.querySelectorAll(".session-card");n.length&&(a=n.length,i=120)}document.getElementById("stats-bar").innerHTML='<div class="stat-card"><div class="stat-icon sessions">S</div><div class="stat-info"><div class="val">'+t+'</div><div class="lbl">Total Sessions</div></div></div><div class="stat-card"><div class="stat-icon files">F</div><div class="stat-info"><div class="val">'+a+'</div><div class="lbl">Showing</div></div></div><div class="stat-card"><div class="stat-icon changes">C</div><div class="stat-info"><div class="val">'+i+'</div><div class="lbl">Avg changes</div></div></div>'}
function renderList(e){var t=document.getElementById("sessions-list");if(!e.length){t.innerHTML='<div class="empty-state"><div class="empty-icon">...</div><p>No sessions found.</p><p style="font-size:13px">Run <code>aiscribe log -c</code> in your project.</p></div>';return}t.innerHTML=e.map(function(e){var t=new Date(e.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),a="";e.project&&(a+='<span class="badge badge-project">'+esc(e.project)+"</span> "),e.aiTool&&(a+='<span class="badge badge-tool">'+esc(e.aiTool)+"</span> ");return'<div class="session-card" onclick="showSession(\''+e.id+"')\"><div class=\"card-top\"><span class=\"card-name\">"+esc(e.branch)+'</span><div class="card-badges">'+a+'</div></div><div class="card-meta"><span>'+t+'</span><span class="dot"></span><span>'+e.filesChanged+" files</span><span class=\"dot\"></span><span>+"+e.insertions+"/-"+e.deletions+"</span></div>"+(e.summarySnippet?'<div class="card-snippet">'+esc(e.summarySnippet)+"</div>":"")+"</div>"}).join("")}
function renderPagination(){var e=document.getElementById("pagination");if(totalPages<=1){e.innerHTML="";return}var t="";t+='<button class="page-btn" onclick="goPage('+(currentPage-1)+')"'+((currentPage<=1?" disabled":""))+">Prev</button>";for(var a=1;a<=totalPages;a++)t+='<button class="page-btn'+(a===currentPage?" active":"")+'" onclick="goPage('+a+')">'+a+"</button>";t+='<button class="page-btn" onclick="goPage('+(currentPage+1)+')"'+((currentPage>=totalPages?" disabled":""))+">Next</button>",e.innerHTML=t}
function goPage(e){e>=1&&e<=totalPages&&(currentPage=e,load(),window.scrollTo({top:0,behavior:"smooth"}))}
function search(){currentPage=1,load()}
function showSession(e){fetch("/api/sessions/"+e).then(function(e){return e.json()}).then(function(e){if(e.error){document.getElementById("detail-content").innerHTML="<p>Session not found.</p>";return}document.getElementById("list-view").style.display="none",document.getElementById("detail-view").classList.add("active");var t=new Date(e.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}),a='<div class="detail-card"><h1>'+esc(e.branch)+'</h1><div class="detail-meta"><span>'+t+'</span><span class="sep">·</span><span>'+e.filesChanged+' files</span><span class="sep">·</span><span>+'+e.insertions+"/-"+e.deletions+"</span>"+(e.aiTool?'<span class="sep">·</span><span class="badge badge-tool">'+esc(e.aiTool)+"</span>":"")+'</div><div class="detail-body">'+renderMarkdown(e.summary||"No summary available.")+"</div></div>";document.getElementById("detail-content").innerHTML=a}).catch(function(){document.getElementById("detail-content").innerHTML="<p>Could not load session.</p>"})}
function showList(){document.getElementById("list-view").style.display="block",document.getElementById("detail-view").classList.remove("active")}
function renderMarkdown(e){return e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,'<code style="background:var(--bg);padding:2px 6px;border-radius:4px;font-size:13px;color:var(--coral-light)">$1</code>').replace(/^- (.+)$/gm,"<li>$1</li>").replace(/\n\n/g,"<br>")}
function esc(e){return(e||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
load();
</script>
</body>
</html>
