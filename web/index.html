<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>AiScribe · Session Book</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-navy: #080c16;
  --fg: #f0f6fc; --fg-2: #8b949e; --fg-3: #484f58;
  --line: rgba(255,255,255,0.06); --line-hi: rgba(255,255,255,0.1);
  --coral: #ff6354; --coral-light: #ff8a7a;
  --coral-glow: rgba(255,99,84,0.12); --coral-glow-strong: rgba(255,99,84,0.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg-2);min-height:100vh;font-size:15px;line-height:1.6}
.nav{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:rgba(13,17,23,0.94);backdrop-filter:blur(16px)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.nav-brand img{width:32px;height:32px;border-radius:8px}
.nav-brand-text{font-size:17px;font-weight:700;letter-spacing:-0.01em}
.nav-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--coral-glow);color:var(--coral-light);border:1px solid rgba(255,99,84,0.2);font-weight:600}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{color:var(--fg-2);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:all 0.15s;font-weight:500}
.nav-link:hover{background:rgba(255,255,255,0.05);color:var(--fg)}

.container{max-width:1200px;margin:0 auto;padding:0 24px}
.hero-strip{background:var(--bg-navy);border-bottom:1px solid var(--line);padding:32px 0}
.hero-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-title h2{font-size:22px;font-weight:700;color:var(--fg);letter-spacing:-0.01em}
.hero-title p{font-size:13px;color:var(--fg-3);margin-top:4px}
.stats-row{display:flex;gap:12px}
.stat-pill{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-align:center;min-width:90px}
.stat-pill .n{font-size:20px;font-weight:700;color:var(--fg)}
.stat-pill .l{font-size:10px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px}

.toolbar{background:var(--bg-navy);padding:16px 0;border-bottom:1px solid var(--line)}
.toolbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-wrap{flex:1;min-width:240px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.search-wrap input{width:100%;padding:10px 14px 10px 40px;border-radius:10px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg);font-size:14px;outline:none;font-family:inherit;transition:border-color 0.15s}
.search-wrap input:focus{border-color:var(--coral)}
.search-wrap input::placeholder{color:var(--fg-3)}
.select-sort{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg-2);font-size:13px;cursor:pointer;outline:none;font-family:inherit}
.btn-icon{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg-2);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s;text-decoration:none}
.btn-icon:hover{background:var(--coral-glow);border-color:rgba(255,99,84,0.2);color:var(--coral-light)}

.sessions-wrap{padding:24px 0 80px}
.sessions-grid{display:flex;flex-direction:column;gap:8px}
.session-card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;cursor:pointer;transition:all 0.2s}
.session-card:hover{border-color:rgba(255,99,84,0.2);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card-title{font-size:16px;font-weight:600;color:var(--fg);letter-spacing:-0.01em;word-break:break-word}
.badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 10px;border-radius:10px;font-weight:600;white-space:nowrap;letter-spacing:0.02em}
.badge-project{background:rgba(88,166,255,0.07);color:#58a6ff;border:1px solid rgba(88,166,255,0.14)}
.badge-tool{background:rgba(63,185,80,0.07);color:#3fb950;border:1px solid rgba(63,185,80,0.14)}
.card-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg-3);align-items:center}
.card-meta .sep{opacity:0.3}
.card-snippet{font-size:13px;color:var(--fg-2);line-height:1.55;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.detail-view{display:none}
.detail-view.active{display:block}
.detail-nav-sticky{position:sticky;top:56px;z-index:20;background:rgba(13,17,23,0.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 24px}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--line);color:var(--fg-2);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:all 0.15s}
.back-btn:hover{border-color:rgba(255,99,84,0.2);color:var(--fg);background:var(--coral-glow)}
.detail-card{background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:36px 40px}
.detail-card h1{font-size:26px;font-weight:700;color:var(--fg);letter-spacing:-0.02em;margin-bottom:10px}
.detail-meta-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg-2);margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.detail-meta-row .sep{color:var(--fg-3)}
.detail-body{font-size:15px;line-height:1.75;color:var(--fg-2)}
.detail-body h2{font-size:18px;font-weight:700;color:var(--fg);margin:28px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
.detail-body h3{font-size:15px;font-weight:600;color:var(--fg);margin:20px 0 8px}
.detail-body strong{color:var(--fg);font-weight:600}
.detail-body code{font-family:'Geist Mono','SF Mono',monospace;background:var(--bg);padding:2px 8px;border-radius:5px;font-size:13px;color:var(--coral-light)}
.detail-body pre{font-family:'Geist Mono','SF Mono',monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:20px;overflow-x:auto;font-size:13px;margin:14px 0;line-height:1.6}
.detail-body ul,.detail-body ol{padding-left:1.5rem;margin:10px 0}
.detail-body li{margin:4px 0}
.detail-body blockquote{border-left:3px solid var(--coral);padding-left:16px;margin:14px 0;color:var(--fg-2)}

.chat-user{background:var(--coral-glow);border:1px solid rgba(255,99,84,0.15);border-radius:12px;padding:14px 18px;margin:12px 0}
.chat-user strong{color:var(--coral-light)}
.chat-user em{font-size:11px;color:var(--fg-3);margin-left:8px;font-style:normal}
.chat-assistant{background:rgba(88,166,255,0.06);border:1px solid rgba(88,166,255,0.12);border-radius:12px;padding:14px 18px;margin:12px 0}
.chat-assistant strong{color:#58a6ff}
.chat-assistant em{font-size:11px;color:var(--fg-3);margin-left:8px;font-style:normal}
.chat-tool{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;font-size:13px}
.chat-tool em{font-size:11px;color:var(--fg-3);font-style:normal}
.chat-tool pre{background:transparent!important;border:none!important;padding:8px 0!important;margin:6px 0!important}

.pagination{padding:32px 0;display:flex;justify-content:center;align-items:center;gap:6px}
.page-btn{min-width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg-2);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s;padding:0 12px}
.page-btn:hover:not(:disabled){border-color:rgba(255,99,84,0.3);color:var(--coral-light);background:var(--coral-glow)}
.page-btn:disabled{opacity:0.25;cursor:default}
.page-btn.active{background:var(--coral-glow);border-color:rgba(255,99,84,0.3);color:var(--coral-light);font-weight:600}

.scroll-top{position:fixed;bottom:80px;right:24px;width:40px;height:40px;border-radius:12px;background:var(--bg-card);border:1px solid var(--line);color:var(--fg-2);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:40;opacity:0;transform:translateY(10px);transition:all 0.2s;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.scroll-top.visible{opacity:1;transform:translateY(0)}
.scroll-top:hover{background:var(--coral-glow);border-color:rgba(255,99,84,0.2);color:var(--coral-light)}

/* Action bar at bottom of detail view */
.action-bar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(13,17,23,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 24px;display:none;gap:8px;justify-content:center;flex-wrap:wrap}
.action-bar.active{display:flex}
.action-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg-card);color:var(--fg-2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s;text-decoration:none;white-space:nowrap}
.action-btn:hover{background:var(--coral-glow);border-color:rgba(255,99,84,0.2);color:var(--coral-light)}

.empty-state{text-align:center;padding:80px 20px}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:0.3}
.empty-state h3{font-size:17px;color:var(--fg-2);margin-bottom:8px}
.empty-state p{font-size:14px;color:var(--fg-3);margin-bottom:6px}
.empty-state code{font-family:'Geist Mono',monospace;background:var(--bg-card);padding:3px 10px;border-radius:5px;color:var(--coral-light);font-size:13px;border:1px solid var(--line)}
.loading-state{text-align:center;padding:80px 20px;color:var(--fg-3);font-size:14px}
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center}
.footer p{font-size:12px;color:var(--fg-3)}

@media print{body{background:#fff;color:#000}.nav,.action-bar,.scroll-top,.detail-nav-sticky,.footer{display:none!important}.detail-card{background:#fff;border:1px solid #ccc;box-shadow:none}.chat-user,.chat-assistant,.chat-tool{background:#f8f8f8;border:1px solid #ddd}}
@media(max-width:640px){
  .hero-inner{flex-direction:column;align-items:flex-start}
  .stats-row{width:100%}.stat-pill{flex:1}
  .detail-card{padding:24px 20px}
  .detail-card h1{font-size:20px}
}
</style>
</head>
<body>
<canvas id="particles" style="position:fixed;inset:0;pointer-events:none;z-index:0" aria-hidden="true"></canvas>

<nav class="nav"><div class="nav-inner">
  <a href="/" class="nav-brand"><img src="logo.png" alt="AiScribe" onerror="this.style.display='none'"><span class="nav-brand-text">AiScribe</span><span class="nav-badge">v1.2</span></a>
  <div class="nav-links">
    <a href="https://github.com/aiagentflow/aiscribe" target="_blank" rel="noopener" class="nav-link">GitHub</a>
    <a href="https://www.npmjs.com/package/aiscribe" target="_blank" rel="noopener" class="nav-link">npm</a>
    <a href="https://aiagentflow.dev/aiscribe" target="_blank" rel="noopener" class="nav-link">Website</a>
  </div>
</div></nav>

<div id="app">
  <div id="list-view">
    <div class="hero-strip"><div class="hero-inner">
      <div class="hero-title"><h2>Session Book</h2><p>Your AI coding journal, searchable forever</p></div>
      <div class="stats-row" id="stats-row"></div>
    </div></div>
    <div class="toolbar"><div class="toolbar-inner">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search by branch name or keyword..." oninput="search()">
      </div>
      <select class="select-sort" id="sort" onchange="search()"><option value="date">Newest first</option><option value="files">Most files changed</option><option value="changes">Most lines changed</option></select>
      <button class="btn-icon" onclick="load()" title="Refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>Refresh</button>
    </div></div>
    <div class="container sessions-wrap">
      <div class="sessions-grid" id="sessions-list"><div class="loading-state">Loading sessions...</div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div class="detail-view" id="detail-view">
    <div class="detail-nav-sticky" id="detail-nav-sticky" style="display:none"><div class="container" style="display:flex;align-items:center;justify-content:space-between">
      <button class="back-btn" onclick="showList()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
      <button class="back-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>Top</button>
    </div></div>
    <div class="container"><div id="detail-content"></div></div>
  </div>

  <div class="action-bar" id="action-bar">
    <button class="action-btn" onclick="downloadMd()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download .md</button>
    <button class="action-btn" onclick="copyMd()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy .md</button>
    <button class="action-btn" onclick="printPdf()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 12H4a2 2 0 00-2 2v4a2 2 0 002 2h16a2 2 0 002-2v-4a2 2 0 00-2-2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>PDF</button>
    <button class="action-btn" onclick="shareUrl()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Share</button>
  </div>

  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <div class="footer"><p>AiScribe · Open source · MIT · <a href="https://aiagentflow.dev" style="color:var(--fg-3)">aiagentflow.dev</a></p></div>
</div>

<script>
var currentSessionId=null;
var currentPage=1,totalPages=1;

(function(){var c=document.getElementById("particles"),ctx=c.getContext("2d"),ps=[];
function r(){c.width=window.innerWidth;c.height=window.innerHeight}r();window.addEventListener("resize",r);
for(var i=0;i<35;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+.5,vx:(Math.random()-.5)*.3,vy:-(Math.random()*.5+.2),a:Math.random()*.4+.1,s:Math.random()*.5+.3});
function d(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<ps.length;i++){var p=ps[i];p.y+=p.vy*p.s;p.x+=p.vx;if(p.y<-10){p.y=c.height+10;p.x=Math.random()*c.width}if(p.x<-10)p.x=c.width+10;if(p.x>c.width+10)p.x=-10;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(255,99,84,"+p.a+")";ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);ctx.fillStyle="rgba(255,99,84,"+(p.a*.15)+")";ctx.fill()}requestAnimationFrame(d)}d();})();

function copyId(id,el){navigator.clipboard.writeText(id).then(function(){var o=el.innerHTML;el.innerHTML="Copied!";el.style.color="var(--coral-light)";setTimeout(function(){el.innerHTML=o;el.style.color=""},1500)});}

function downloadMd(){if(currentSessionId)window.open("/api/sessions/"+currentSessionId+"/download","_blank")}
function copyMd(){if(!currentSessionId)return;fetch("/api/sessions/"+currentSessionId).then(function(r){return r.json()}).then(function(s){var t="# "+s.branch+"\n\n**Date:** "+s.date+"\n**Files:** "+s.filesChanged+"\n**Lines:** +"+s.insertions+" / -"+s.deletions+"\n"+(s.aiTool?"**Tool:** "+s.aiTool+"\n":"")+"\n---\n\n"+s.summary;navigator.clipboard.writeText(t).then(function(){var b=document.querySelector(".action-btn:nth-child(2)");b.innerHTML=b.innerHTML.replace("Copy .md","Copied!");setTimeout(function(){b.innerHTML=b.innerHTML.replace("Copied!","Copy .md")},1500)})})}
function printPdf(){window.print()}
function shareUrl(){if(currentSessionId){var u=window.location.origin+"/?session="+currentSessionId;navigator.clipboard.writeText(u);var b=document.querySelector(".action-btn:nth-child(4)");b.innerHTML=b.innerHTML.replace("Share","Copied!");setTimeout(function(){b.innerHTML=b.innerHTML.replace("Copied!","Share")},1500)}}

function load(){var q=document.getElementById("search").value,s=document.getElementById("sort").value;fetch("/api/sessions?page="+currentPage+"&search="+encodeURIComponent(q)+"&sort="+s).then(function(r){return r.json()}).then(function(d){totalPages=d.pages;renderStats(d.total);renderList(d.items);renderPagination()}).catch(function(){document.getElementById("sessions-list").innerHTML='<div class="empty-state"><div class="empty-icon">!</div><h3>Connection failed</h3><p>Could not reach the AIScribe server.</p></div>'})}
function renderStats(total){var el=document.getElementById("stats-row"),showing=document.querySelectorAll(".session-card").length||0;el.innerHTML='<div class="stat-pill"><div class="n">'+(total||0)+'</div><div class="l">Sessions</div></div><div class="stat-pill"><div class="n">'+showing+'</div><div class="l">Showing</div></div>'}
function renderList(items){var el=document.getElementById("sessions-list");if(!items.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">...</div><h3>No sessions yet</h3><p>Run <code>aiscribe log -c</code> in your project to get started</p></div>';return}el.innerHTML=items.map(function(s){var d=new Date(s.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),b="";if(s.project)b+='<span class="badge badge-project">'+esc(s.project)+"</span> ";if(s.aiTool)b+='<span class="badge badge-tool">'+esc(s.aiTool)+"</span> ";return '<div class="session-card" onclick="showSession(\''+s.id+"')\"><div class=\"card-row\"><span class=\"card-title\">"+esc(s.branch)+'</span><div class="badges">'+b+'</div></div><div class="card-meta"><span>'+d+'</span><span class="sep">·</span><span>'+s.filesChanged+' files</span><span class="sep">·</span><span>+'+s.insertions+" / -"+s.deletions+'</span><span class="sep">·</span><span style="font-family:monospace;font-size:11px;color:var(--fg-3)">'+s.id+'</span><button onclick="event.stopPropagation();copyId(\''+s.id+"',this)\" class=\"btn-icon\" style=\"padding:3px 8px;font-size:11px;margin-left:4px\" title=\"Copy session ID\">Copy ID</button></div>"+(s.summarySnippet?'<div class="card-snippet">'+esc(s.summarySnippet)+"</div>":"")+"</div>"}).join("")}
function renderPagination(){var el=document.getElementById("pagination");if(totalPages<=1){el.innerHTML="";return}var h='<button class="page-btn" onclick="goPage('+(currentPage-1)+')"'+(currentPage<=1?" disabled":"")+">Prev</button>";for(var i=1;i<=totalPages;i++)h+='<button class="page-btn'+(i===currentPage?" active":"")+'" onclick="goPage('+i+')">'+i+"</button>";h+='<button class="page-btn" onclick="goPage('+(currentPage+1)+')"'+(currentPage>=totalPages?" disabled":"")+">Next</button>";el.innerHTML=h}
function goPage(p){if(p>=1&&p<=totalPages){currentPage=p;load();window.scrollTo({top:0,behavior:"smooth"})}}
function search(){currentPage=1;load()}

function showSession(id){currentSessionId=id;fetch("/api/sessions/"+id).then(function(r){return r.json()}).then(function(s){if(s.error){document.getElementById("detail-content").innerHTML="<p>Session not found.</p>";return}document.getElementById("list-view").style.display="none";document.getElementById("detail-view").classList.add("active");document.getElementById("detail-nav-sticky").style.display="block";document.getElementById("scrollTop").classList.add("visible");document.getElementById("action-bar").classList.add("active");var d=new Date(s.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});var meta='<div class="detail-card"><h1>'+(s.number?"#"+s.number+" ":"")+esc(s.branch)+'</h1><div class="detail-meta-row"><span>'+d+'</span><span class="sep">·</span><span>'+s.filesChanged+' files</span><span class="sep">·</span><span>+'+s.insertions+" / -"+s.deletions+"</span>"+(s.aiTool?'<span class="sep">·</span><span class="badge badge-tool">'+esc(s.aiTool)+"</span>":"")+'</div><div class="detail-body">'+md(s.summary||"No summary.")+"</div></div>";document.getElementById("detail-content").innerHTML=meta;window.scrollTo({top:0,behavior:"smooth"})}).catch(function(){document.getElementById("detail-content").innerHTML="<p>Could not load session.</p>"})}
function showList(){document.getElementById("list-view").style.display="block";document.getElementById("detail-view").classList.remove("active");document.getElementById("detail-nav-sticky").style.display="none";document.getElementById("scrollTop").classList.remove("visible");document.getElementById("action-bar").classList.remove("active");currentSessionId=null;window.scrollTo({top:0,behavior:"smooth"})}

window.addEventListener("scroll",function(){var b=document.getElementById("scrollTop");if(window.scrollY>400)b.classList.add("visible");else b.classList.remove("visible")});

function md(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/```(\w*)\n([\s\S]*?)```/g,"<pre><code>$2</code></pre>").replace(/^- (.+)$/gm,"<li>$1</li>").replace(/\n\n/g,"<br><br>")}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
load();
</script>
</body>
</html>
