<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiScribe · Markdown to PDF</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown-light.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--canvas:#f2efe8;--paper:#fff;--ink:#1a1a21;--ink-soft:#57555f;--line:#e3ded3;
  --shell:#1a1a21;--shell-raised:#22222b;--shell-line:#32323d;--chalk:#e9e7e0;--chalk-dim:#9b99a4;
  --rust:#b5552f;--rust-strong:#9a4526;--rust-tint:#f6ede7}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--canvas);color:var(--ink);height:100vh;overflow:hidden}
/* HEADER */
.header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line);height:46px;z-index:10;flex-shrink:0}
.header-brand{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}
.header-brand img{width:22px;height:22px;border-radius:4px}
.header-title{flex:1;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:11px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.1s;white-space:nowrap}
.btn:hover{background:#f5f2ec;border-color:#d4cfc5}.btn.primary{background:var(--rust);color:#fff;border-color:var(--rust)}.btn.primary:hover{background:var(--rust-strong)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:2px;padding:5px 10px;background:var(--shell);border-bottom:1px solid var(--shell-line);overflow-x:auto;flex-shrink:0}
.toolbar .sep{width:1px;height:16px;background:var(--shell-line);margin:0 5px;flex-shrink:0}
.tbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:5px;border:none;background:transparent;color:var(--chalk-dim);cursor:pointer;font-size:13px;font-family:inherit;transition:all 0.1s;flex-shrink:0}
.tbtn:hover{background:var(--shell-raised);color:var(--chalk)}

/* SPLIT */
.split{display:flex;flex:1;overflow:hidden}
.pane{overflow-y:auto;overflow-x:hidden;position:relative}
.pane-left{flex:1;background:var(--shell)}
.pane-right{flex:1;background:var(--canvas)}
.divider{width:5px;background:var(--shell-line);cursor:col-resize;flex-shrink:0}
.divider:hover,.divider.dragging{background:var(--rust)}
.editor{width:100%;height:100%;border:none;resize:none;padding:28px 32px;font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.65;color:var(--chalk);background:transparent;outline:none;tab-size:2}
.editor::placeholder{color:var(--chalk-dim)}
.preview{padding:36px 44px;min-height:100%}
.preview .markdown-body{font-size:15px;line-height:1.7;box-shadow:none!important;padding:0!important;background:transparent!important}

/* SETTINGS */
.settings{position:fixed;top:46px;right:12px;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.1);padding:14px;min-width:190px;display:none}
.settings.open{display:block}
.settings h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:8px}
.settings label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px}
.settings select,.settings input{width:100%;padding:5px 8px;border-radius:4px;border:1px solid var(--line);font-size:11px;font-family:inherit;margin-bottom:8px;background:var(--paper);color:var(--ink)}

@media(max-width:768px){.split{flex-direction:column}.pane-left{flex:0 0 45%;border-bottom:1px solid var(--line)}.divider{width:100%;height:5px;cursor:row-resize}.preview{padding:18px}.editor{padding:18px}}
@media print{.header,.toolbar,.divider,.pane-left,.settings{display:none!important}.pane-right{overflow:visible}.preview{padding:0}}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="header-brand"><img src="logo.png" alt="AiScribe" onerror="this.style.display='none'"><span>AiScribe</span></a>
  <span class="header-title" id="doc-title">Markdown to PDF</span>
  <button class="btn" onclick="toggleSettings()" title="Settings">Settings</button>
  <button class="btn" onclick="downloadMd()">Download .md</button>
  <button class="btn primary" onclick="window.print()">Export PDF</button>
</header>
<div class="toolbar">
  <button class="tbtn" onclick="fmt('bold')" title="Bold"><b>B</b></button>
  <button class="tbtn" onclick="fmt('italic')" title="Italic"><i>I</i></button>
  <button class="tbtn" onclick="fmt('strike')" title="Strikethrough"><s>S</s></button>
  <button class="tbtn" onclick="fmt('code')" title="Code">&lt;/&gt;</button>
  <span class="sep"></span>
  <button class="tbtn" onclick="fmt('h2')" title="Heading">H</button>
  <button class="tbtn" onclick="fmt('quote')" title="Quote">"</button>
  <button class="tbtn" onclick="fmt('ul')" title="Bullet list">•</button>
  <button class="tbtn" onclick="fmt('ol')" title="Numbered">1.</button>
  <span class="sep"></span>
  <button class="tbtn" onclick="fmt('link')" title="Link">🔗</button>
  <button class="tbtn" onclick="fmt('image')" title="Image">🖼</button>
  <button class="tbtn" onclick="fmt('table')" title="Table">⊞</button>
  <button class="tbtn" onclick="fmt('hr')" title="Rule">—</button>
</div>
<div class="settings" id="settings">
  <h3>Page settings</h3>
  <label>Paper size</label>
  <select id="page-size" onchange="updateSettings()"><option value="a4">A4</option><option value="letter" selected>Letter</option><option value="legal">Legal</option></select>
  <label>Margin (mm)</label><input type="number" id="page-margin" value="20" min="5" max="50" onchange="updateSettings()">
</div>
<div class="split">
  <div class="pane pane-left"><textarea class="editor" id="editor" placeholder="Write Markdown here..." oninput="renderPreview()"></textarea></div>
  <div class="divider" id="divider"></div>
  <div class="pane pane-right"><div class="preview" id="preview"><div class="markdown-body"><p>Loading...</p></div></div></div>
</div>
<script>
marked.setOptions({breaks:true,gfm:true});
marked.use({renderer:{code:function(t,l){try{var c=hljs.highlight(t,{language:l||"",ignoreIllegal:true}).value;return'<pre><code class="hljs">'+c+"</code></pre>"}catch(e){return'<pre><code>'+t+"</code></pre>"}}}});
var editor=document.getElementById("editor"),preview=document.getElementById("preview"),original="",pageSize="letter",pageMargin=20;
function renderPreview(){preview.innerHTML='<div class="markdown-body" style="max-width:800px;margin:0 auto">'+marked.parse(editor.value)+"</div>"}
function loadSession(id){fetch("/api/sessions/"+id).then(function(r){return r.json()}).then(function(s){if(s.error){preview.innerHTML="<p>Session not found.</p>";return}document.getElementById("doc-title").textContent=s.branch||"Export";var d=new Date(s.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});var t="# "+(s.number?"#"+s.number+" ":"")+s.branch+"\n\n**"+d+"** · "+s.filesChanged+" files · +"+s.insertions+"/-"+s.deletions+(s.aiTool?" · "+s.aiTool:"")+"\n\n---\n\n"+(s.summary||"_No summary._");original=t;editor.value=t;renderPreview()}).catch(function(){preview.innerHTML="<p>Could not load session.</p>"})}
function fmt(t){var e=editor,st=e.selectionStart,en=e.selectionEnd,v=e.value,s=v.substring(st,en)||"text";function w(a,b){e.value=v.substring(0,st)+a+s+b+v.substring(en);e.focus();e.selectionStart=st+a.length;e.selectionEnd=en+a.length;renderPreview()}function p(a){var l=v.substring(0,st).split("\n"),ls=l[l.length-1];e.value=v.substring(0,st-st.toString().length)+a+ls+v.substring(en);renderPreview()}if(t==="bold")w("**","**");else if(t==="italic")w("_","_");else if(t==="strike")w("~~","~~");else if(t==="code")w("`","`");else if(t==="h2")p("## ");else if(t==="quote")p("> ");else if(t==="ul")p("- ");else if(t==="ol")p("1. ");else if(t==="link")w("[","](url)");else if(t==="image")w("![alt](",")");else if(t==="table")w("","\n\n| Col A | Col B |\n| --- | --- |\n| Cell | Cell |\n");else if(t==="hr")w("\n\n---\n\n","")}
function updateSettings(){pageSize=document.getElementById("page-size").value;pageMargin=parseInt(document.getElementById("page-margin").value)||20;renderPreview();localStorage.setItem("apdf",JSON.stringify({s:pageSize,m:pageMargin}))}
function toggleSettings(){document.getElementById("settings").classList.toggle("open")}
function downloadMd(){var b=new Blob([editor.value],{type:"text/markdown"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(document.getElementById("doc-title").textContent||"document").replace(/\s+/g,"-")+".md";a.click()}
var d=document.getElementById("divider"),left=document.querySelector(".pane-left"),right=document.querySelector(".pane-right"),dragging=false;
d.addEventListener("mousedown",function(){dragging=true;d.classList.add("dragging");document.body.style.cursor="col-resize";document.body.style.userSelect="none"});
document.addEventListener("mousemove",function(e){if(!dragging)return;var t=left.parentElement.offsetWidth,x=e.clientX,p=(x/t)*100;if(p>20&&p<80){left.style.flex="0 0 "+p+"%";right.style.flex="0 0 "+(100-p)+"%"}});
document.addEventListener("mouseup",function(){dragging=false;d.classList.remove("dragging");document.body.style.cursor="";document.body.style.userSelect=""});
var s=localStorage.getItem("apdf");if(s){var p=JSON.parse(s);pageSize=p.s||"letter";pageMargin=p.m||20;document.getElementById("page-size").value=pageSize;document.getElementById("page-margin").value=pageMargin}
var id=new URLSearchParams(window.location.search).get("id");if(id)loadSession(id);else{editor.value="# New Document\n\nStart writing...";renderPreview()}
</script>
</body>
</html>
