  <path d="M382 150 Q382 130 352 130 L272 130 Q256 130 256 150 L256 360 Q256 380 272 380 L352 380 Q382 380 382 360 Z" 
        fill="#0d1117" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Spine line -->
  <line x1="256" y1="130" x2="256" y2="380" stroke="url(#g)" stroke-width="5"/>

  <!-- Left page text lines -->
  <rect x="148" y="170" width="90" height="6" rx="3" fill="#8b949e" opacity="0.5"/>
  <rect x="148" y="192" width="90" height="6" rx="3" fill="#8b949e" opacity="0.5"/>
  <rect x="148" y="214" width="72" height="6" rx="3" fill="#8b949e" opacity="0.4"/>
  <rect x="148" y="240" width="82" height="6" rx="3" fill="#8b949e" opacity="0.3"/>
  <rect x="148" y="266" width="60" height="6" rx="3" fill="#8b949e" opacity="0.3"/>

  <!-- Right page text lines -->
  <rect x="274" y="170" width="90" height="6" rx="3" fill="#8b949e" opacity="0.5"/>
  <rect x="274" y="192" width="90" height="6" rx="3" fill="#8b949e" opacity="0.5"/>
  <rect x="274" y="214" width="78" height="6" rx="3" fill="#8b949e" opacity="0.4"/>
  <rect x="274" y="240" width="86" height="6" rx="3" fill="#8b949e" opacity="0.3"/>
  <rect x="274" y="266" width="58" height="6" rx="3" fill="#8b949e" opacity="0.3"/>

  <!-- AI sparkle above the book -->
  <g transform="translate(256,85)">
    <line x1="0" y1="-22" x2="0" y2="22" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-16" y1="-16" x2="16" y2="16" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="-16" x2="-16" y2="16" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#3fb950"/>
  </g>

  <!-- Bottom glow -->
  <ellipse cx="256" cy="360" rx="80" ry="15" fill="url(#g)" opacity="0.08"/>

  <text x="256" y="455" font-family="system-ui,sans-serif" font-weight="800" font-size="36" fill="#f0f6fc" text-anchor="middle" letter-spacing="4">AISCRIBE</text>
