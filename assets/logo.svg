<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 140" fill="none">
  <!-- Background for light-mode visibility -->
  <rect width="440" height="140" rx="12" fill="#0d1117"/>
  <rect width="440" height="140" rx="12" stroke="#21262d" stroke-width="1.5"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <!-- Book icon -->
  <rect x="28" y="30" width="50" height="62" rx="4" stroke="url(#g)" stroke-width="2.5" fill="#161b22"/>
  <line x1="53" y1="30" x2="53" y2="92" stroke="url(#g)" stroke-width="1.5"/>
  <!-- Book content lines -->
  <line x1="36" y1="44" x2="48" y2="44" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="36" y1="52" x2="48" y2="52" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="36" y1="60" x2="44" y2="60" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="72" y2="44" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="58" y1="52" x2="72" y2="52" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="58" y1="60" x2="68" y2="60" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="36" y1="72" x2="58" y2="72" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="36" y1="80" x2="50" y2="80" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Pen -->
  <path d="M40 94 L47 101 L44 104 L37 97 Z" fill="#3fb950" opacity="0.8"/>
  <line x1="44" y1="104" x2="52" y2="114" stroke="#3fb950" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Text -->
  <text x="95" y="60" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="34" fill="#f0f6fc">AIScribe</text>
  <text x="95" y="86" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="15" fill="#8b949e">Your AI's scribe</text>
  <text x="95" y="106" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="15" fill="#8b949e">Every session, recorded.</text>
  <!-- Brand dot -->
  <circle cx="88" cy="46" r="3" fill="#3fb950"/>
</svg>
