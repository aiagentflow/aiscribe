<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.3"/>

  <!-- Terminal window -->
  <rect x="96" y="140" width="320" height="240" rx="18" fill="#0d1117" stroke="url(#g)" stroke-width="5"/>
  <!-- Title bar -->
  <rect x="96" y="140" width="320" height="44" rx="18" fill="#161b22"/>
  <rect x="96" y="162" width="320" height="22" fill="#161b22"/>
  <!-- Traffic lights -->
  <circle cx="120" cy="162" r="7" fill="#ff5f57"/>
  <circle cx="142" cy="162" r="7" fill="#febc2e"/>
  <circle cx="164" cy="162" r="7" fill="#28c840"/>
  <!-- Title text -->
  <text x="256" y="168" font-family="monospace" font-size="16" fill="#8b949e" text-anchor="middle">aiscribe log</text>

  <!-- Terminal content -->
  <text x="116" y="210" font-family="monospace" font-size="15" fill="#8b949e">$</text>
  <text x="132" y="210" font-family="monospace" font-size="15" fill="#7ee787">aiscribe</text>
  <text x="220" y="210" font-family="monospace" font-size="15" fill="#58a6ff">log</text>
  <text x="260" y="210" font-family="monospace" font-size="15" fill="#8b949e">-c -n</text>
  <text x="320" y="210" font-family="monospace" font-size="15" fill="#d29922">"stripe-refunds"</text>

  <text x="116" y="240" font-family="monospace" font-size="13" fill="#484f58">┌─ git diff</text>
  <text x="116" y="258" font-family="monospace" font-size="13" fill="#484f58">│  Branch: main</text>
  <text x="116" y="276" font-family="monospace" font-size="13" fill="#484f58">│  Files: 47  +892/-156</text>
  <text x="116" y="294" font-family="monospace" font-size="13" fill="#484f58">└─</text>

  <text x="116" y="322" font-family="monospace" font-size="14" fill="#3fb950">✓ Session recorded!</text>
  <text x="132" y="342" font-family="monospace" font-size="12" fill="#484f58">.aiscribe/sessions/2026-...</text>

  <!-- Blinking cursor -->
  <rect x="125" y="352" width="8" height="14" rx="2" fill="#58a6ff" opacity="0.8"/>

  <!-- Recording dot (top right) -->
  <circle cx="420" cy="155" r="18" fill="#0d1117" stroke="#3fb950" stroke-width="4"/>
  <circle cx="420" cy="155" r="8" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="256" y="440" font-family="system-ui,sans-serif" font-weight="800" font-size="44" fill="#f0f6fc" text-anchor="middle" letter-spacing="3">AISCRIBE</text>
</svg>
